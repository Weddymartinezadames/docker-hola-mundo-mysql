version: '3.8'

services:
  # Servicio de la aplicación Node.js
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: user_app
      DB_PASSWORD: user_password
      DB_NAME: holamundo_db
    depends_on:
      - db
    restart: always

  # Servicio de la Base de Datos MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: holamundo_db
      MYSQL_USER: user_app
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data: